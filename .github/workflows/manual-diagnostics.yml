name: One-shot patch maintenance

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/manual-diagnostics.yml

permissions:
  contents: write

env:
  UPSTREAM_SHA: bc7f02eddd3d84085849dc19ed216f11c23b0571
  UPSTREAM_VERSION: 1.0.12
  SOURCE_REV: d5a0335a47221e8c9519936cb693e9b6450227ec
  RUST_TOOLCHAIN: "1.94.0"
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  maintain:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config --global user.name gork-ci
          git config --global user.email gork-ci@users.noreply.github.com

      - name: Materialize current functional stack
        run: python3 maint/scripts/patchctl.py checkout

      - name: Fold telemetry manifest fix and Clippy fix into telemetry hard-off
        run: |
          set -euo pipefail
          cd .work/src
          git reset --hard HEAD
          git clean -fd

          C10=$(git log --format='%H' --grep='^Gork-Patch-Id: telemetry-hard-off$' -1)
          C11=$(git log --format='%H' --grep='^Gork-Patch-Id: telemetry-manifest-fix$' -1)
          test -n "$C10"
          test -n "$C11"

          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/codegen/xai-mixpanel/src/lib.rs')
          text = p.read_text()
          needle = 'const REQUEST_TIMEOUT: std::time::Duration = std::time::Duration::from_secs(10);\n\n'
          if text.count(needle) != 1:
              raise SystemExit(f'expected exactly one REQUEST_TIMEOUT block, found {text.count(needle)}')
          p.write_text(text.replace(needle, '', 1))
          PY
          git add crates/codegen/xai-mixpanel/src/lib.rs
          git commit --fixup="$C10"

          export C11
          cat >/tmp/gork-sequence-editor.py <<'PY'
          #!/usr/bin/env python3
          import os
          import sys
          from pathlib import Path
          todo = Path(sys.argv[1])
          target = os.environ['C11']
          lines = todo.read_text().splitlines()
          found = False
          out = []
          for line in lines:
              parts = line.split(maxsplit=2)
              if len(parts) >= 2 and parts[0] in {'pick', 'p'} and target.startswith(parts[1]):
                  out.append('fixup ' + line.split(maxsplit=1)[1])
                  found = True
              else:
                  out.append(line)
          if not found:
              raise SystemExit('telemetry-manifest-fix commit not found in rebase todo')
          todo.write_text('\n'.join(out) + '\n')
          PY
          chmod +x /tmp/gork-sequence-editor.py
          GIT_SEQUENCE_EDITOR=/tmp/gork-sequence-editor.py \
            git rebase -i --autosquash "$UPSTREAM_SHA"

          test "$(git log --format='%B' "$UPSTREAM_SHA"..HEAD | grep -c '^Gork-Patch-Id: telemetry-hard-off$')" -eq 1
          test "$(git log --format='%B' "$UPSTREAM_SHA"..HEAD | grep -c '^Gork-Patch-Id: telemetry-manifest-fix$' || true)" -eq 0
          ! grep -q 'const REQUEST_TIMEOUT' crates/codegen/xai-mixpanel/src/lib.rs

      - name: Remove temporary patch manifest entry and re-export stack
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('maint/patchset.toml')
          text = p.read_text()
          marker = '# Temporary 1.0.12 replay fix; squash back into telemetry-hard-off after the\n'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('telemetry-manifest-fix marker not found')
          next_block = '[[patch]]\nid = "research-upload-hard-off"'
          end = text.find(next_block, start)
          if end < 0:
              raise SystemExit('research-upload-hard-off block not found')
          p.write_text(text[:start] + text[end:])
          PY
          python3 maint/scripts/patchctl.py finalize-sync \
            --upstream "$UPSTREAM_SHA" \
            --version "$UPSTREAM_VERSION" \
            --source-rev "$SOURCE_REV"
          python3 maint/scripts/patchctl.py lint

      - name: Apply security floor and smoke contract fix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          sec = Path('maint/security-floors.toml')
          text = sec.read_text()
          if 'package = "h2"' not in text:
              if not text.endswith('\n'):
                  text += '\n'
              text += '\n[[floor]]\npackage = "h2"\nprecise = "0.4.16"\nadvisory = "RUSTSEC-2026-0258"\n'
              sec.write_text(text)
          elif 'package = "h2"\nprecise = "0.4.16"\nadvisory = "RUSTSEC-2026-0258"' not in text:
              raise SystemExit('existing h2 floor does not match required 0.4.16 / RUSTSEC-2026-0258')

          wf = Path('.github/workflows/gork-privacy.yml')
          text = wf.read_text()
          old = "echo \"$HELP\" | grep -q 'Usage: gork'"
          new = "echo \"$HELP\" | grep -q 'Usage: grok'"
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale gork Usage assertion, found {text.count(old)}')
          wf.write_text(text.replace(old, new, 1))

          for path in (
              Path('maint/diagnostics/latest-ci.txt'),
              Path('maint/diagnostics/final-validation.txt'),
          ):
              if path.exists():
                  path.unlink()
          PY

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler pkg-config libssl-dev cmake libclang-dev build-essential

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy,rustfmt

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Capture final validation
        id: validate
        run: |
          set -euo pipefail
          mkdir -p maint/diagnostics
          OUT=maint/diagnostics/final-validation.txt
          : > "$OUT"
          FAIL=0
          CHECKOUT_RC=0

          run_check() {
            local label="$1"
            shift
            local log
            local rc
            log=$(mktemp)
            set +e
            "$@" >"$log" 2>&1
            rc=$?
            set -e
            {
              echo "===== $label ====="
              echo "exit=$rc"
              tail -n 240 "$log"
              echo
            } >> "$OUT"
            rm -f "$log"
            if [ "$rc" -ne 0 ]; then
              FAIL=1
            fi
            LAST_RC="$rc"
          }

          run_check PATCHCTL_CHECKOUT python3 maint/scripts/patchctl.py checkout
          CHECKOUT_RC="$LAST_RC"
          run_check PATCHCTL_LINT python3 maint/scripts/patchctl.py lint
          run_check PATCHCTL_ROUNDTRIP python3 maint/scripts/patchctl.py roundtrip

          if [ "$CHECKOUT_RC" -eq 0 ]; then
            run_check CARGO_AUDIT python3 maint/scripts/patchctl.py verify --only cargo-audit
            run_check CLIPPY_PRIVACY bash -lc 'cd .work/src && cargo clippy --no-deps -p xai-grok-version -p xai-mixpanel -p xai-grok-telemetry -p xai-grok-update --lib -- -D warnings'
            run_check CLIPPY_BINARY bash -lc 'cd .work/src && cargo clippy --no-deps -p xai-grok-pager-bin --bins -- -D warnings'
            run_check RUSTFMT bash -lc 'cd .work/src && cargo fmt --all -- --check'
          else
            {
              echo '===== CARGO_VALIDATION ====='
              echo 'skipped because PATCHCTL_CHECKOUT failed'
              echo
            } >> "$OUT"
          fi

          echo "failed=$FAIL" >> "$GITHUB_OUTPUT"
          echo "validation_failed=$FAIL" >> "$OUT"

      - name: Commit diagnostics on validation failure
        if: steps.validate.outputs.failed == '1'
        run: |
          set -euo pipefail
          git add -f maint/diagnostics/final-validation.txt
          git commit --only -m "ci: capture final maintenance validation" -- maint/diagnostics/final-validation.txt
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Commit maintained patch stack
        if: steps.validate.outputs.failed == '0'
        run: |
          set -euo pipefail
          rm -f maint/diagnostics/latest-ci.txt maint/diagnostics/final-validation.txt
          git add maint/patchset.toml maint/upstream.lock.toml maint/security-floors.toml \
            .github/workflows/gork-privacy.yml maint/last-apply-status.json
          git add -A maint/patches maint/diagnostics
          git commit -m "maint: fix latest upstream CI and fold telemetry patch"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
