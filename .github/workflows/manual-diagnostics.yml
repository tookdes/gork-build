name: Manual latest diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/manual-diagnostics.yml

permissions:
  contents: write

env:
  UPSTREAM_SHA: bc7f02eddd3d84085849dc19ed216f11c23b0571
  UPSTREAM_VERSION: 1.0.12
  SOURCE_REV: d5a0335a47221e8c9519936cb693e9b6450227ec
  RUST_TOOLCHAIN: "1.94.0"
  CARGO_TERM_COLOR: never

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name gork-ci
          git config user.email gork-ci@users.noreply.github.com

      - name: Replay patches on latest official upstream
        run: |
          set -euo pipefail
          python3 maint/scripts/patchctl.py apply \
            --upstream "$UPSTREAM_SHA" \
            --expect-version "$UPSTREAM_VERSION" \
            --expect-source-rev "$SOURCE_REV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Capture cargo-audit diagnostics
        run: |
          set -euo pipefail
          mkdir -p maint/diagnostics
          AUDIT_LOG=$(mktemp)
          set +e
          (cd .work/src && cargo audit >"$AUDIT_LOG" 2>&1)
          AUDIT_RC=$?
          set -e
          OUT=maint/diagnostics/latest-ci.txt
          {
            echo "===== CARGO_AUDIT_REAL ====="
            echo "exit=$AUDIT_RC"
            tail -n 300 "$AUDIT_LOG"
            echo
            echo "diagnostic upstream=$UPSTREAM_SHA"
          } > "$OUT"
          rm -f "$AUDIT_LOG"

      - name: Commit diagnostics only
        run: |
          set -euo pipefail
          git add -f maint/diagnostics/latest-ci.txt
          git commit -m "ci: capture real cargo-audit diagnostics" -- maint/diagnostics/latest-ci.txt
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
