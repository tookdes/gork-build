name: Manual latest diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/manual-diagnostics.yml

permissions:
  contents: write

env:
  UPSTREAM_SHA: bc7f02eddd3d84085849dc19ed216f11c23b0571
  UPSTREAM_VERSION: 1.0.12
  SOURCE_REV: d5a0335a47221e8c9519936cb693e9b6450227ec
  RUST_TOOLCHAIN: "1.94.0"
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name gork-ci
          git config user.email gork-ci@users.noreply.github.com

      - name: Replay patches on latest official upstream
        run: |
          set -euo pipefail
          python3 maint/scripts/patchctl.py apply \
            --upstream "$UPSTREAM_SHA" \
            --expect-version "$UPSTREAM_VERSION" \
            --expect-source-rev "$SOURCE_REV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler pkg-config libssl-dev cmake libclang-dev build-essential

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Capture Clippy and audit diagnostics
        run: |
          set -euo pipefail
          mkdir -p maint/diagnostics
          CLIPPY_LOG=$(mktemp)
          AUDIT_LOG=$(mktemp)
          CLIPPY_RC=$(mktemp)
          AUDIT_RC=$(mktemp)
          (
            set +e
            cd .work/src
            cargo clippy --no-deps \
              -p xai-grok-version \
              -p xai-mixpanel \
              -p xai-grok-telemetry \
              -p xai-grok-update \
              --lib \
              -- -D warnings >"$CLIPPY_LOG" 2>&1
            echo "$?" >"$CLIPPY_RC"
          ) &
          CLIPPY_PID=$!
          (
            set +e
            cd .work/src
            cargo audit --locked >"$AUDIT_LOG" 2>&1
            echo "$?" >"$AUDIT_RC"
          ) &
          AUDIT_PID=$!
          wait "$CLIPPY_PID"
          wait "$AUDIT_PID"
          OUT=maint/diagnostics/latest-ci.txt
          {
            echo "===== CLIPPY_PRIVACY ====="
            echo "exit=$(cat "$CLIPPY_RC")"
            tail -n 240 "$CLIPPY_LOG"
            echo
            echo "===== CARGO_AUDIT ====="
            echo "exit=$(cat "$AUDIT_RC")"
            tail -n 240 "$AUDIT_LOG"
            echo
            echo "diagnostic upstream=$UPSTREAM_SHA"
          } > "$OUT"
          rm -f "$CLIPPY_LOG" "$AUDIT_LOG" "$CLIPPY_RC" "$AUDIT_RC"

      - name: Commit diagnostics only
        run: |
          set -euo pipefail
          git add -f maint/diagnostics/latest-ci.txt
          git commit -m "ci: capture latest upstream diagnostics" -- maint/diagnostics/latest-ci.txt
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
