name: One-shot patch maintenance

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/manual-diagnostics.yml

permissions:
  contents: write

env:
  UPSTREAM_SHA: bc7f02eddd3d84085849dc19ed216f11c23b0571
  UPSTREAM_VERSION: 1.0.12
  SOURCE_REV: d5a0335a47221e8c9519936cb693e9b6450227ec
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  maintain:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config --global user.name gork-ci
          git config --global user.email gork-ci@users.noreply.github.com

      - name: Materialize current functional stack
        run: python3 maint/scripts/patchctl.py checkout

      - name: Fold telemetry manifest fix and Clippy fix into telemetry hard-off
        run: |
          set -euo pipefail
          cd .work/src
          git reset --hard HEAD
          git clean -fd

          C10=$(git log --format='%H' --grep='^Gork-Patch-Id: telemetry-hard-off$' -1)
          C11=$(git log --format='%H' --grep='^Gork-Patch-Id: telemetry-manifest-fix$' -1)
          test -n "$C10"
          test -n "$C11"

          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/codegen/xai-mixpanel/src/lib.rs')
          text = p.read_text()
          needle = 'const REQUEST_TIMEOUT: std::time::Duration = std::time::Duration::from_secs(10);\n\n'
          if text.count(needle) != 1:
              raise SystemExit(f'expected exactly one REQUEST_TIMEOUT block, found {text.count(needle)}')
          p.write_text(text.replace(needle, '', 1))
          PY
          git add crates/codegen/xai-mixpanel/src/lib.rs
          git commit --fixup="$C10"

          export C11
          cat >/tmp/gork-sequence-editor.py <<'PY'
          #!/usr/bin/env python3
          import os
          import sys
          from pathlib import Path
          todo = Path(sys.argv[1])
          target = os.environ['C11']
          lines = todo.read_text().splitlines()
          found = False
          out = []
          for line in lines:
              parts = line.split(maxsplit=2)
              if len(parts) >= 2 and parts[0] in {'pick', 'p'} and target.startswith(parts[1]):
                  out.append('fixup ' + line.split(maxsplit=1)[1])
                  found = True
              else:
                  out.append(line)
          if not found:
              raise SystemExit('telemetry-manifest-fix commit not found in rebase todo')
          todo.write_text('\n'.join(out) + '\n')
          PY
          chmod +x /tmp/gork-sequence-editor.py
          GIT_SEQUENCE_EDITOR=/tmp/gork-sequence-editor.py \
            git rebase -i --autosquash "$UPSTREAM_SHA"

          test "$(git log --format='%B' "$UPSTREAM_SHA"..HEAD | grep -c '^Gork-Patch-Id: telemetry-hard-off$')" -eq 1
          test "$(git log --format='%B' "$UPSTREAM_SHA"..HEAD | grep -c '^Gork-Patch-Id: telemetry-manifest-fix$' || true)" -eq 0
          ! grep -q 'const REQUEST_TIMEOUT' crates/codegen/xai-mixpanel/src/lib.rs

      - name: Remove temporary patch manifest entry and re-export stack
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('maint/patchset.toml')
          text = p.read_text()
          marker = '# Temporary 1.0.12 replay fix; squash back into telemetry-hard-off after the\n'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('telemetry-manifest-fix marker not found')
          next_block = '[[patch]]\nid = "research-upload-hard-off"'
          end = text.find(next_block, start)
          if end < 0:
              raise SystemExit('research-upload-hard-off block not found')
          p.write_text(text[:start] + text[end:])
          PY
          python3 maint/scripts/patchctl.py finalize-sync \
            --upstream "$UPSTREAM_SHA" \
            --version "$UPSTREAM_VERSION" \
            --source-rev "$SOURCE_REV"

      - name: Add h2 security floor and remove temporary diagnostics
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          sec = Path('maint/security-floors.toml')
          text = sec.read_text()
          if 'package = "h2"' not in text:
              if not text.endswith('\n'):
                  text += '\n'
              text += '\n[[floor]]\npackage = "h2"\nprecise = "0.4.16"\nadvisory = "RUSTSEC-2026-0258"\n'
              sec.write_text(text)
          elif 'package = "h2"\nprecise = "0.4.16"\nadvisory = "RUSTSEC-2026-0258"' not in text:
              raise SystemExit('existing h2 floor does not match required 0.4.16 / RUSTSEC-2026-0258')

          for path in (
              Path('maint/diagnostics/latest-ci.txt'),
              Path('maint/diagnostics/final-validation.txt'),
          ):
              if path.exists():
                  path.unlink()
          PY

      - name: Re-materialize and verify patch structure
        run: |
          set -euo pipefail
          python3 maint/scripts/patchctl.py checkout
          python3 maint/scripts/patchctl.py lint
          python3 maint/scripts/patchctl.py roundtrip

      - name: Commit maintained patch stack
        run: |
          set -euo pipefail
          git add -A -- maint
          git status --short
          if git diff --cached --quiet; then
            echo 'maintenance produced no staged changes' >&2
            exit 1
          fi
          git commit -m "maint: fix latest upstream CI and fold telemetry patch"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
