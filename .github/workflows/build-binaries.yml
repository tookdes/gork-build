name: Build Binaries

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-binaries-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.94.0"

jobs:
  strict-tests:
    name: Strict OpenAI tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config --global user.email "gork-ci@users.noreply.github.com"
          git config --global user.name "Gork CI"

      - name: Materialize product tree
        run: python3 maint/scripts/patchctl.py checkout

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev cmake libclang-dev build-essential

      - name: Install protoc 29.3
        shell: bash
        run: |
          set -euo pipefail
          DEST="${RUNNER_TEMP}/protoc"
          mkdir -p "$DEST"
          curl -fsSL --retry 5 -o "${RUNNER_TEMP}/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip"
          unzip -q -o "${RUNNER_TEMP}/protoc.zip" -d "$DEST"
          echo "PROTOC=${DEST}/bin/protoc" >> "$GITHUB_ENV"
          echo "${DEST}/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: strict-tests
          workspaces: .work/src
          cache-targets: "true"

      - name: Check formatting
        run: cargo fmt --all --manifest-path .work/src/Cargo.toml -- --check

      - name: Run strict compatibility tests
        run: cargo test -p xai-grok-sampler --manifest-path .work/src/Cargo.toml strict_ -- --nocapture

  build:
    name: Build ${{ matrix.platform }}
    needs: strict-tests
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin-arm64
            runner: macos-latest
          - platform: darwin-x64
            runner: macos-latest
            target: x86_64-apple-darwin
          - platform: win32-x64
            runner: windows-latest
          - platform: win32-arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config --global user.email "gork-ci@users.noreply.github.com"
          git config --global user.name "Gork CI"

      - name: Materialize product tree
        run: python3 maint/scripts/patchctl.py checkout

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev cmake libclang-dev build-essential

      - name: Install system deps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y nasm
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install protoc 29.3
        shell: bash
        run: |
          set -euo pipefail
          VER=29.3
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)      SUFFIX="linux-x86_64" ;;
            Linux-ARM64)    SUFFIX="linux-aarch_64" ;;
            macOS-ARM64)    SUFFIX="osx-aarch_64" ;;
            macOS-X64)      SUFFIX="osx-x86_64" ;;
            Windows-X64)    SUFFIX="win64" ;;
            Windows-ARM64)  SUFFIX="win64" ;;
            *) echo "unsupported runner ${{ runner.os }}-${{ runner.arch }}" >&2; exit 1 ;;
          esac
          DEST="${RUNNER_TEMP}/protoc"
          mkdir -p "$DEST"
          curl -fsSL --retry 5 -o "${RUNNER_TEMP}/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${VER}/protoc-${VER}-${SUFFIX}.zip"
          unzip -q -o "${RUNNER_TEMP}/protoc.zip" -d "$DEST"
          BIN="${DEST}/bin/protoc"
          if [[ "${{ runner.os }}" == "Windows" ]]; then BIN="${BIN}.exe"; fi
          "$BIN" --version
          echo "PROTOC=${BIN}" >> "$GITHUB_ENV"
          echo "${DEST}/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: binary-${{ matrix.platform }}
          workspaces: .work/src
          cache-targets: "true"

      - name: Build gork
        shell: bash
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C link-arg=/DEBUG:NONE' || '' }}
        run: |
          set -euo pipefail
          if [[ -n "${{ matrix.target }}" ]]; then
            cargo build -p xai-grok-pager-bin --release --target "${{ matrix.target }}" \
              --manifest-path .work/src/Cargo.toml
          else
            cargo build -p xai-grok-pager-bin --release \
              --manifest-path .work/src/Cargo.toml
          fi

      - name: Stage binary
        shell: bash
        run: |
          set -euo pipefail
          OUTDIR=".work/src/target/release"
          if [[ -n "${{ matrix.target }}" ]]; then
            OUTDIR=".work/src/target/${{ matrix.target }}/release"
          fi
          mkdir -p "dist/${{ matrix.platform }}"
          if [[ "${{ matrix.platform }}" == win32-* ]]; then
            cp "${OUTDIR}/gork.exe" "dist/${{ matrix.platform }}/gork.exe"
          else
            cp "${OUTDIR}/gork" "dist/${{ matrix.platform }}/gork"
            chmod +x "dist/${{ matrix.platform }}/gork"
          fi
          printf '%s\n' "upstream=$(sed -n 's/^commit = \"\(.*\)\"/\1/p' maint/upstream.lock.toml | head -1)" \
            "version=$(sed -n 's/^version = \"\(.*\)\"/\1/p' maint/upstream.lock.toml | head -1)" \
            > "dist/${{ matrix.platform }}/BUILD-INFO.txt"

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gork-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
